# Track A: bf16 LoRA on glm-4-voice-9b with the Somali SFT set (finetune/build_sft.py).
run_name: lora_somali
seed: 1234
attn_implementation: sdpa        # falls back to eager if the remote code refuses
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: [query_key_value, dense, dense_h_to_4h, dense_4h_to_h]
train:
  num_train_epochs: 2
  max_steps: -1                  # >0 overrides epochs (smoke tests)
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8 # effective batch 64
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 4
  dataloader_num_workers: 4
eval_per_task: 300               # val samples per task for the per-task eval losses
